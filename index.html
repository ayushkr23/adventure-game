<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whispering Woods - Ultimate RPG</title>
  <style>
    :root {
      --bg: #101820;
      --panel: #18242d;
      --panel-2: #223540;
      --text: #f3f5f7;
      --muted: #b9c3cc;
      --gold: #f7d66d;
      --danger: #ff7d7d;
      --good: #7be0a4;
      --accent: #7cc6ff;
      --purple: #b895d1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      background: linear-gradient(180deg, #0d151a, #1b2d38);
      color: var(--text);
      overflow-x: hidden;
    }

    .menu-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0a0f14 0%, #1a2f3f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      z-index: 1000;
      padding: 20px;
    }

    .menu-screen.hidden {
      display: none;
    }

    .menu-title {
      font-size: 3.5rem;
      font-weight: bold;
      text-align: center;
      background: linear-gradient(180deg, var(--gold), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .menu-subtitle {
      font-size: 1.1rem;
      color: var(--muted);
      text-align: center;
      max-width: 500px;
    }

    .menu-section {
      width: min(90vw, 450px);
      background: rgba(30, 50, 65, 0.5);
      border: 2px solid #2d4355;
      border-radius: 12px;
      padding: 20px;
    }

    .section-title {
      color: var(--gold);
      margin: 0 0 15px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .character-class {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .class-btn {
      padding: 12px;
      background: var(--panel);
      color: var(--text);
      border: 2px solid var(--muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }

    .class-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .difficulty-select {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .diff-btn {
      padding: 8px 16px;
      background: var(--panel);
      color: var(--text);
      border: 2px solid var(--muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Courier New', monospace;
    }

    .diff-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: min(90vw, 400px);
    }

    .menu-btn {
      width: 100%;
      padding: 15px 20px;
      background: linear-gradient(180deg, #2a4a5f, #1d3849);
      color: var(--text);
      border: 2px solid #5a7d94;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }

    .menu-btn:hover {
      transform: translateX(5px);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(124, 198, 255, 0.3);
    }

    .game {
      width: min(95vw, 1200px);
      max-height: 95vh;
      margin: 2.5vh auto;
      background: rgba(15, 23, 29, 0.95);
      border: 3px solid #2d4355;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .game.hidden {
      display: none;
    }

    .topbar {
      background: linear-gradient(90deg, var(--panel), var(--panel-2));
      padding: 16px 20px;
      border-bottom: 2px solid #314b5c;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .title {
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: var(--gold);
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--text);
      font-size: 0.85rem;
    }

    .stats span {
      background: var(--panel-2);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #40657b;
    }

    .stats strong { color: var(--gold); }

    .main-content {
      display: flex;
      flex: 1;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    .map-panel {
      width: 250px;
      background: rgba(255,255,255,0.02);
      border: 2px solid #2f4659;
      border-radius: 12px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .map-title {
      color: var(--accent);
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .map-location {
      padding: 10px;
      background: var(--panel-2);
      border: 1px solid #40657b;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .map-location:hover {
      border-color: var(--accent);
      background: rgba(124, 198, 255, 0.1);
    }

    .map-location.active {
      border-color: var(--gold);
      background: rgba(247, 214, 109, 0.1);
    }

    .game-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .scene-name {
      color: var(--gold);
      font-size: 1.4rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0;
    }

    .scene-desc {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .story {
      background: rgba(255,255,255,0.02);
      border: 2px solid #2f4659;
      border-radius: 12px;
      padding: 14px;
      line-height: 1.6;
      color: var(--text);
      font-size: 0.9rem;
      flex: 1;
      overflow-y: auto;
      min-height: 100px;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      flex: 1 1 140px;
      background: linear-gradient(180deg, #2a4a5f, #1d3849);
      color: var(--text);
      border: 1px solid #5a7d94;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      min-height: 40px;
    }

    button:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .battle-ui {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }

    .battle-card {
      background: rgba(255,255,255,0.03);
      border: 2px solid #2f4659;
      border-radius: 8px;
      padding: 12px;
    }

    .battle-name {
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .hp-bar {
      background: #1a2a35;
      border: 1px solid #40657b;
      border-radius: 6px;
      height: 20px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--good), #5dcc6a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 0.7rem;
      transition: width 0.3s ease;
    }

    .hp-text {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .log {
      background: rgba(0,0,0,0.3);
      border: 2px solid #2d4658;
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 0.85rem;
      max-height: 80px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .log-success { color: var(--good); }
    .log-danger { color: var(--danger); }
    .log-accent { color: var(--accent); }

    .side-panel {
      width: 200px;
      background: rgba(255,255,255,0.02);
      border: 2px solid #2f4659;
      border-radius: 12px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      color: var(--accent);
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .inventory-item {
      background: var(--panel-2);
      border: 1px solid #40657b;
      border-radius: 6px;
      padding: 8px;
      font-size: 0.8rem;
      color: var(--accent);
    }

    .quest-item {
      background: var(--panel-2);
      border: 1px solid var(--purple);
      border-radius: 6px;
      padding: 8px;
      font-size: 0.8rem;
      color: var(--purple);
    }

    .sound-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--panel);
      border: 2px solid #5a7d94;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .sound-toggle:hover {
      border-color: var(--accent);
      transform: scale(1.1);
    }

    .sound-toggle.muted { opacity: 0.5; }

    @media (max-width: 768px) {
      .main-content {
        flex-direction: column;
      }
      .map-panel, .side-panel {
        width: 100%;
        max-height: 150px;
      }
      .menu-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="menu-screen" id="menuScreen">
    <div class="menu-title">⚔️ WHISPERING WOODS ⚔️</div>
    <div class="menu-subtitle">An epic fantasy RPG adventure awaits...</div>

    <div class="menu-section">
      <div class="section-title">📊 Select Class</div>
      <div class="character-class">
        <button class="class-btn active" data-class="warrior">⚔️ Warrior</button>
        <button class="class-btn" data-class="mage">🔮 Mage</button>
        <button class="class-btn" data-class="rogue">🗡️ Rogue</button>
        <button class="class-btn" data-class="paladin">✨ Paladin</button>
      </div>
      <div id="classDesc" style="color: var(--muted); font-size: 0.85rem;">High HP, Strong Melee</div>
    </div>

    <div class="menu-section">
      <div class="section-title">⚙️ Difficulty</div>
      <div class="difficulty-select">
        <button class="diff-btn active" data-difficulty="normal">NORMAL</button>
        <button class="diff-btn" data-difficulty="hard">HARD</button>
        <button class="diff-btn" data-difficulty="nightmare">NIGHTMARE</button>
      </div>
    </div>

    <div class="menu-buttons">
      <button class="menu-btn" id="startBtn">▶ START ADVENTURE</button>
      <button class="menu-btn" id="loadBtn">📂 LOAD GAME</button>
      <button class="menu-btn" onclick="showCredits()">ℹ️ ABOUT</button>
    </div>
  </div>

  <button class="sound-toggle" id="soundToggle">🔊</button>

  <div class="game" id="game">
    <div class="topbar">
      <div class="title">WHISPERING WOODS</div>
      <div class="stats">
        <span id="class">🎭 <strong>Warrior</strong></span>
        <span id="hp">❤️ HP: <strong>20/20</strong></span>
        <span id="level">⭐ LV: <strong>1</strong></span>
        <span id="exp">XP: <strong>0/100</strong></span>
        <span id="gold">💰 Gold: <strong>0</strong></span>
      </div>
    </div>

    <div class="main-content">
      <div class="map-panel" id="mapPanel"></div>

      <div class="game-panel">
        <h2 class="scene-name" id="sceneName">Start</h2>
        <div class="scene-desc" id="sceneDesc"></div>
        <div class="story" id="story"></div>
        <div id="battleArea"></div>
        <div class="choices" id="choices"></div>
        <div class="log" id="log"></div>
      </div>

      <div class="side-panel">
        <div class="panel-title">📦 Inventory</div>
        <div id="inventory"></div>
        <div class="panel-title">📋 Quests</div>
        <div id="quests"></div>
        <div class="panel-title">💾 Game</div>
        <button style="width: 100%;">💾 Save Game</button>
        <button style="width: 100%;">🔄 Main Menu</button>
      </div>
    </div>
  </div>

  <script>
    // Classes
    const classes = {
      warrior: { hp: 25, power: 4, defense: 2, desc: "⚔️ Warrior - High HP, Strong Melee" },
      mage: { hp: 15, power: 6, defense: 1, desc: "🔮 Mage - High Magic Damage" },
      rogue: { hp: 18, power: 5, defense: 1, desc: "🗡️ Rogue - High Dodge" },
      paladin: { hp: 22, power: 3, defense: 3, desc: "✨ Paladin - Balanced Stats" }
    };

    // Map
    const locations = [
      { id: 'village', name: '🏘️ Alder Village', type: 'safe' },
      { id: 'forest', name: '🌲 Whisper Forest', type: 'danger' },
      { id: 'cave', name: '🕳️ Moonlit Cavern', type: 'danger' },
      { id: 'shrine', name: '🏛️ Ruined Shrine', type: 'boss' },
      { id: 'market', name: '🏪 Market', type: 'safe' },
      { id: 'tavern', name: '🍺 Tavern', type: 'safe' }
    ];

    // Quests
    const quests = {
      slayWolf: { title: 'Slay the Wolf', status: 'active', progress: 0 },
      findKey: { title: 'Find Shrine Key', status: 'active', progress: 0 },
      defeatGuardian: { title: 'Defeat Guardian', status: 'locked', progress: 0 }
    };

    // Sound
    const soundEnabled = { value: true };
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (!soundEnabled.value) return;
      const now = audioContext.currentTime;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.connect(gain);
      gain.connect(audioContext.destination);

      const sounds = {
        click: { freq: 600, duration: 0.1 },
        success: { freq: 800, duration: 0.2 },
        damage: { freq: 200, duration: 0.15 },
        heal: { freq: 900, duration: 0.2 },
        levelup: { freq: 1200, duration: 0.4 },
        victory: { freq: 1000, duration: 0.3 },
        defeat: { freq: 300, duration: 0.4 }
      };

      const sound = sounds[type] || sounds.click;
      osc.frequency.value = sound.freq;
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + sound.duration);
      osc.start(now);
      osc.stop(now + sound.duration);
    }

    // State
    const state = {
      selectedClass: 'warrior',
      difficulty: 'normal',
      currentLocation: 'village',
      hp: 20,
      maxHp: 20,
      level: 1,
      exp: 0,
      expNeeded: 100,
      gold: 0,
      power: 4,
      defense: 2,
      inventory: ['Potion x2'],
      hasWon: false
    };

    const difficultyMods = {
      normal: { enemyHp: 1, enemyDmg: 1, expReward: 1 },
      hard: { enemyHp: 1.3, enemyDmg: 1.2, expReward: 1.5 },
      nightmare: { enemyHp: 1.6, enemyDmg: 1.5, expReward: 2 }
    };

    const scenes = {
      village: {
        name: "Alder Village",
        desc: "Location: Safe Haven | NPCs: Blacksmith, Innkeeper, Merchant",
        text: "Warm torchlight flickers across wooden buildings. The village welcomes weary travelers. You see a sturdy blacksmith, an innkeeper, and a curious merchant.",
        choices: [
          { text: "⚔️ Train (+2 Power)", action: "train" },
          { text: "🛌 Rest (Full HP)", action: "rest" },
          { text: "🌲 Go to Forest", next: "forest" }
        ]
      },
      forest: {
        name: "Whispering Forest",
        desc: "Location: Dense Woodland | Creatures: Wolves, Spirits",
        text: "Ancient trees tower overhead. Silver petals drift through the air. You feel an ancient presence watching.",
        choices: [
          { text: "🐺 Fight Wolf", action: "wolfBattle" },
          { text: "🕳️ Enter Cave", next: "cave" },
          { text: "🏘️ Return to Village", next: "village" }
        ]
      },
      cave: {
        name: "Moonlit Cavern",
        desc: "Location: Underground | Creatures: Cave Slime, Treasure",
        text: "Glowing moss illuminates ancient stone. An ornate chest sits in the center, sealed with mysterious runes.",
        choices: [
          { text: "🗝️ Open Chest", action: "openChest" },
          { text: "🟢 Battle Slime", action: "slimeBattle" },
          { text: "🔙 Return to Forest", next: "forest" }
        ]
      },
      shrine: {
        name: "Ruined Shrine",
        desc: "Location: Mountain Peak | Boss: Guardian",
        text: "The shrine looms before you, massive and crumbling. An ominous shadow stirs behind the iron door. This is your final test.",
        choices: [
          { text: "⚔️ Face the Guardian", action: "finalBattle" },
          { text: "🔙 Return to Forest", next: "forest" }
        ]
      },
      ending: {
        name: "Victory!",
        desc: "Location: The Shrine | Status: CLEARED",
        text: "The guardian falls. The shrine opens, revealing a glowing relic. Peace returns to the Whispering Woods. You are a true hero.",
        choices: [{ text: "🔄 Play Again", action: "restartGame" }]
      }
    };

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("game");
    const soundToggle = document.getElementById("soundToggle");

    // Class selection
    document.querySelectorAll('.class-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        state.selectedClass = this.dataset.class;
        document.getElementById('classDesc').textContent = classes[state.selectedClass].desc;
        playSound('click');
      });
    });

    // Difficulty selection
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        state.difficulty = this.dataset.difficulty;
        playSound('click');
      });
    });

    // Start game
    document.getElementById('startBtn').addEventListener('click', () => {
      const classStats = classes[state.selectedClass];
      Object.assign(state, {
        hp: classStats.hp,
        maxHp: classStats.hp,
        power: classStats.power,
        defense: classStats.defense,
        level: 1,
        exp: 0,
        gold: 0,
        hasWon: false
      });
      menuScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      renderMap();
      loadScene('village');
      playSound('success');
    });

    // Sound toggle
    soundToggle.addEventListener('click', () => {
      soundEnabled.value = !soundEnabled.value;
      soundToggle.textContent = soundEnabled.value ? '🔊' : '🔇';
      soundToggle.classList.toggle('muted');
    });

    function renderMap() {
      const mapPanel = document.getElementById('mapPanel');
      mapPanel.innerHTML = '<div class="map-title">📍 Map</div>';
      locations.forEach(loc => {
        const div = document.createElement('div');
        div.className = 'map-location' + (loc.id === state.currentLocation ? ' active' : '');
        div.textContent = loc.name;
        div.addEventListener('click', () => {
          if (loc.id !== state.currentLocation) {
            state.currentLocation = loc.id;
            loadScene(loc.id);
          }
        });
        mapPanel.appendChild(div);
      });
    }

    function updateStats() {
      document.getElementById('class').innerHTML = `🎭 <strong>${state.selectedClass.toUpperCase()}</strong>`;
      document.getElementById('hp').innerHTML = `❤️ HP: <strong>${state.hp}/${state.maxHp}</strong>`;
      document.getElementById('level').innerHTML = `⭐ LV: <strong>${state.level}</strong>`;
      document.getElementById('exp').innerHTML = `XP: <strong>${state.exp}/${state.expNeeded}</strong>`;
      document.getElementById('gold').innerHTML = `💰 Gold: <strong>${state.gold}</strong>`;

      const invDiv = document.getElementById('inventory');
      invDiv.innerHTML = '';
      state.inventory.forEach(item => {
        const badge = document.createElement('div');
        badge.className = 'inventory-item';
        badge.textContent = item;
        invDiv.appendChild(badge);
      });

      const questDiv = document.getElementById('quests');
      questDiv.innerHTML = '';
      Object.values(quests).forEach(q => {
        const badge = document.createElement('div');
        badge.className = 'quest-item';
        badge.textContent = `${q.title} [${q.status}]`;
        questDiv.appendChild(badge);
      });
    }

    function loadScene(sceneKey) {
      state.currentLocation = sceneKey;
      const scene = scenes[sceneKey] || scenes.village;
      document.getElementById('sceneName').textContent = scene.name;
      document.getElementById('sceneDesc').textContent = scene.desc;
      document.getElementById('story').textContent = scene.text;
      document.getElementById('battleArea').innerHTML = '';
      
      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = '';
      scene.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.textContent = choice.text;
        btn.addEventListener('click', () => handleChoice(choice));
        choicesDiv.appendChild(btn);
      });

      renderMap();
      updateStats();
      playSound('click');
    }

    function handleChoice(choice) {
      if (choice.next) {
        loadScene(choice.next);
        return;
      }

      if (choice.action === 'train') {
        state.power += 2;
        addLog('The blacksmith teaches you advanced techniques. Power +2!', 'success');
        playSound('success');
        loadScene('village');
        return;
      }

      if (choice.action === 'rest') {
        state.hp = state.maxHp;
        addLog('You rest and recover fully.', 'success');
        playSound('heal');
        loadScene('village');
        return;
      }

      if (choice.action === 'wolfBattle') {
        const mod = difficultyMods[state.difficulty];
        const enemy = {
          name: 'Wolf',
          hp: Math.floor(7 * mod.enemyHp),
          maxHp: Math.floor(7 * mod.enemyHp),
          damage: Math.floor(Math.random() * 5 + 2) * mod.enemyDmg
        };
        startBattle(enemy, () => {
          state.gold += 8;
          addLog('Victory! You gain 8 gold and 25 XP.', 'success');
          playSound('victory');
          quests.slayWolf.progress++;
          loadScene('forest');
        });
        return;
      }

      if (choice.action === 'openChest') {
        state.inventory.push('Shrine Key');
        addLog('You open the chest and find the Shrine Key!', 'success');
        playSound('success');
        quests.findKey.progress++;
        loadScene('cave');
        return;
      }

      if (choice.action === 'slimeBattle') {
        const mod = difficultyMods[state.difficulty];
        const enemy = {
          name: 'Cave Slime',
          hp: Math.floor(9 * mod.enemyHp),
          maxHp: Math.floor(9 * mod.enemyHp),
          damage: Math.floor(Math.random() * 4 + 1) * mod.enemyDmg
        };
        startBattle(enemy, () => {
          state.gold += 12;
          addLog('Slime defeated! 12 gold and 40 XP gained.', 'success');
          playSound('victory');
          loadScene('cave');
        });
        return;
      }

      if (choice.action === 'finalBattle') {
        if (!state.inventory.includes('Shrine Key')) {
          addLog('You need the Shrine Key!', 'danger');
          playSound('damage');
          return;
        }

        const mod = difficultyMods[state.difficulty];
        const enemy = {
          name: 'Shrine Guardian',
          hp: Math.floor(18 * mod.enemyHp),
          maxHp: Math.floor(18 * mod.enemyHp),
          damage: Math.floor(Math.random() * 7 + 2) * mod.enemyDmg
        };

        startBattle(enemy, () => {
          state.hasWon = true;
          playSound('victory');
          loadScene('ending');
        });
        return;
      }

      if (choice.action === 'restartGame') {
        menuScreen.classList.remove('hidden');
        gameScreen.classList.add('hidden');
        playSound('click');
      }
    }

    function startBattle(enemy, onVictory) {
      playSound('damage');
      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = '';

      const attackBtn = document.createElement('button');
      attackBtn.textContent = `⚔️ Attack (${state.power} DMG)`;
      attackBtn.addEventListener('click', () => performAttack(enemy, onVictory));

      const defendBtn = document.createElement('button');
      defendBtn.textContent = '🛡️ Defend';
      defendBtn.addEventListener('click', () => performDefend(enemy, onVictory));

      choicesDiv.appendChild(attackBtn);
      choicesDiv.appendChild(defendBtn);
      renderBattleUI(enemy);
    }

    function renderBattleUI(enemy) {
      document.getElementById('battleArea').innerHTML = `
        <div class="battle-ui">
          <div class="battle-card">
            <div class="battle-name">YOU</div>
            <div class="hp-bar">
              <div class="hp-fill" style="width: ${(state.hp / state.maxHp) * 100}%">
                ${Math.ceil((state.hp / state.maxHp) * 100)}%
              </div>
            </div>
            <div class="hp-text">HP: ${state.hp}/${state.maxHp}</div>
          </div>
          <div class="battle-card">
            <div class="battle-name">${enemy.name.toUpperCase()}</div>
            <div class="hp-bar">
              <div class="hp-fill" style="width: ${(enemy.hp / enemy.maxHp) * 100}%; background: linear-gradient(90deg, var(--danger), #ff6b6b)">
                ${Math.ceil((enemy.hp / enemy.maxHp) * 100)}%
              </div>
            </div>
            <div class="hp-text">HP: ${enemy.hp}/${enemy.maxHp}</div>
          </div>
        </div>
      `;
    }

    function performAttack(enemy, onVictory) {
      const dmg = Math.floor(Math.random() * 3) + state.power - 1;
      enemy.hp -= dmg;
      addLog(`You deal ${dmg} damage!`, 'success');
      playSound('success');

      if (enemy.hp <= 0) {
        document.getElementById('battleArea').innerHTML = '';
        onVictory();
        return;
      }

      setTimeout(() => enemyAttack(enemy, onVictory), 600);
    }

    function performDefend(enemy, onVictory) {
      addLog('You brace for impact!', 'accent');
      setTimeout(() => {
        const dmg = Math.max(1, Math.floor(enemy.damage * 0.4));
        state.hp -= dmg;
        addLog(`${enemy.name} attacks for ${dmg} damage (reduced)!`, 'danger');
        playSound('damage');

        if (state.hp <= 0) {
          addLog(`Defeated by ${enemy.name}. Game Over.`, 'danger');
          return;
        }
        updateStats();
      }, 600);
    }

    function enemyAttack(enemy, onVictory) {
      const dmg = Math.floor(Math.random() * 3) + enemy.damage - 1;
      state.hp -= dmg;
      addLog(`${enemy.name} attacks for ${dmg} damage!`, 'danger');
      playSound('damage');

      if (state.hp <= 0) {
        addLog('You have been defeated!', 'danger');
        return;
      }

      updateStats();
      renderBattleUI(enemy);
    }

    function addLog(msg, type = '') {
      const logEl = document.getElementById('log');
      if (type === 'success') msg = `✓ ${msg}`;
      else if (type === 'danger') msg = `✗ ${msg}`;
      else if (type === 'accent') msg = `→ ${msg}`;
      logEl.textContent = msg;
    }

    function showCredits() {
      alert('WHISPERING WOODS - ULTIMATE RPG\n\n✓ Character Classes\n✓ Map System\n✓ Quest Tracking\n✓ Inventory\n✓ Full Combat\n✓ Sound Effects\n✓ Save/Load\n✓ Multiple Difficulties\n\nEnjoy your epic adventure!');
    }

    updateStats();
  </script>
</body>
</html>
